
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリップ共有</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    h1 { font-size: 24px; }
    .player {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      margin: 20px auto;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    p { color: #ccc; }
    .controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
  </style>
</head>
<body>
  <h1 id="title">共有クリップ</h1>
  <div class="player">
    <iframe id="video"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <div class="controls">
  <button id="playPause" type="button" disabled>
    ▷ 再生
  </button>

  <button id="restart" type="button" disabled>
    ↺ 開始位置に戻る
  </button>
</div>

<p id="info" hidden></p>
  

<script>
  const params = new URLSearchParams(location.search);

  const videoId = params.get("v");
  const start = Math.max(
    0,
    parseInt(params.get("s") || "0", 10) || 0
  );
  const endValue = params.get("e");
  const end = endValue === null
    ? null
    : Number(endValue);
  const title = params.get("t") || "共有クリップ";

  const titleElement = document.getElementById("title");
  const infoElement = document.getElementById("info");
  const playPauseButton = document.getElementById("playPause");
playPauseButton.disabled = true;
  const videoElement = document.getElementById("video");
const restartButton = document.getElementById("restart");
restartButton.disabled = true;
  titleElement.textContent = title;

  const validVideoId =
    /^[a-zA-Z0-9_-]{11}$/.test(videoId || "");

  const validEnd =
    end === null ||
    (Number.isInteger(end) && end > start);

  if (!validVideoId || !validEnd) {
    infoElement.textContent = "共有リンクが正しくありません。";
  } else {
    infoElement.textContent =
      end !== null
        ? "再生範囲：" + start + "秒 ～ " + end + "秒"
        : "開始位置：" + start + "秒";

    const playerParams = new URLSearchParams({
      start: String(start),
      autoplay: "0",
      enablejsapi: "1",
      playsinline: "1",
      origin: location.origin
    });

    videoElement.src =
      "https://www.youtube.com/embed/" +
      videoId + "?" + playerParams.toString();

    let player = null;
    let monitorId = null;
    let reachedEnd = false;
    playPauseButton.addEventListener("click", function () {
  if (!player) {
    return;
  }

  const state = player.getPlayerState();

  if (state === YT.PlayerState.PLAYING) {
    player.pauseVideo();
  } else {
    // 終了位置で停止していたら開始位置へ戻す
    if (reachedEnd) {
      reachedEnd = false;
      player.seekTo(start, true);
    }

    player.playVideo();
  }
});
restartButton.addEventListener("click", function () {
  if (!player) {
    return;
  }

  // いったん一時停止して開始位置へ戻る
  player.pauseVideo();
  reachedEnd = false;
  player.seekTo(start, true);

  infoElement.textContent =
    end !== null
      ? "再生範囲：" + start + "秒 ～ " + end + "秒"
      : "開始位置：" + start + "秒";
});
    function stopMonitoring() {
      if (monitorId !== null) {
        clearInterval(monitorId);
        monitorId = null;
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("video", {
        events: {
          onReady: function () {
  restartButton.disabled = false;
  playPauseButton.disabled = false;
  playPauseButton.textContent = "▷ 再生";
},

          onStateChange: function (event) {
            // 再生開始
            if (event.data === YT.PlayerState.PLAYING) {
              playPauseButton.textContent = "Ⅱ 一時停止";
              stopMonitoring();

              if (end === null || reachedEnd) {
                return;
              }

              monitorId = setInterval(function () {
                if (player.getCurrentTime() >= end) {
                  reachedEnd = true;
                  stopMonitoring();

                  player.pauseVideo();
                  player.seekTo(end, true);

                  infoElement.textContent =
                    "再生範囲：" + start + "秒 ～ " +
                    end + "秒（一時停止中）";
                }
              }, 100);
            }

            // 一時停止・終了時は監視を停止
           if (
  event.data === YT.PlayerState.PAUSED ||
  event.data === YT.PlayerState.ENDED
) {
  stopMonitoring();
  playPauseButton.textContent = "▷ 再生";
}
          }
        }
      });
    }

    // YouTube IFrame Player APIを読み込む
    window.onYouTubeIframeAPIReady =
      onYouTubeIframeAPIReady;

    const apiScript = document.createElement("script");
    apiScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiScript);
  }
</script>


</body>
</html>
