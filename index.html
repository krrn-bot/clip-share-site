
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリップ共有</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    h1 { font-size: 24px; }
    .player {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      margin: 20px auto;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    p { color: #ccc; }
  </style>
</head>
<body>
  <h1 id="title">共有クリップ</h1>
  <div class="player">
    <iframe id="video"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <p id="info">動画を読み込んでいます…</p>

  
<script>
  const params = new URLSearchParams(location.search);

  const videoId = params.get("v");
  const start = Math.max(
    0,
    parseInt(params.get("s") || "0", 10) || 0
  );
  const endValue = params.get("e");
  const end = endValue === null
    ? null
    : parseInt(endValue, 10);
  const title = params.get("t") || "共有クリップ";

  document.getElementById("title").textContent = title;

  const validVideoId = /^[a-zA-Z0-9_-]{11}$/.test(videoId || "");
  const validEnd = end === null ||
    (Number.isInteger(end) && end > start);

  if (validVideoId && validEnd) {
    const playerParams = new URLSearchParams({
      start: String(start),
      autoplay: "0"
    });

    if (end !== null) {
      playerParams.set("end", String(end));
    }

    document.getElementById("video").src =
      "https://www.youtube.com/embed/" +
      videoId + "?" + playerParams.toString();

    document.getElementById("info").textContent =
      end !== null
        ? "再生範囲：" + start + "秒 ～ " + end + "秒"
        : "開始位置：" + start + "秒";
  } else {
    document.getElementById("info").textContent =
      "共有リンクが正しくありません。";
  }
</script>

</body>
</html>
